<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة سكة | Sekka</title>
    
    <!-- ⚠️ السطر الأهم: استدعاء مكتبة تليجرام الرسمية لتفعيل الأمان وفك الحظر عن الخريطة -->
    <script src="https://telegram.org"></script>
    
    <!-- استدعاء ملفات الخرائط المجانية Leaflet كاملة -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #121212; color: white; }
        #map {
            width: 100%;
            height: 300px;
            background-color: #1a1a1a;
            border-bottom: 3px solid #f39c12;
            position: relative;
            z-index: 1;
        }
        .container { padding: 12px; max-width: 480px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .instruction { font-size: 0.95rem; color: #f1c40f; font-weight: bold; margin-bottom: 10px; }
        .surge-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .toggle-btn { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; color: white; border: 1px solid #333; border-radius: 4px; box-sizing: border-box; }
        .seats-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
        .seat-option { background: #2a2a2a; border: 1px solid #444; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; }
        .seat-option.active { background: #f39c12; color: black; font-weight: bold; border-color: #f39c12; }
        .btn-main { background-color: #f39c12; color: black; font-weight: bold; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 15px; }
        .invoice-box { background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 6px; margin-top: 15px; display: none; }
        .label-text { font-size: 0.85rem; color: #aaa; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="container">
        <div class="surge-section">
            <span>⚡ وقت الذروة (التسعير المرتفع 15 ج/كم)</span>
            <button id="surge-toggle" class="toggle-btn" onclick="toggleSurge()">مغلق 🚫</button>
        </div>

        <div class="card">
            <div id="instruction" class="instruction">📍 اضغط على الخريطة لتحديد نقطة الركوب</div>
            
            <span class="label-text">نوع الرحلة المطلوبة</span>
            <select id="ride-mode" onchange="updateVehicleOptions()">
                <option value="combo">رحلة مشتركة (كومبو شاتل - تقسيم السعر) 👥</option>
                <option value="private">طلب خاص (ملاكي ومزايدة)</option>
            </select>

            <span class="label-text">السيارة المقترحة تلقائياً للاسطول:</span>
            <input type="text" id="vehicle-type" value="عربية سوزوكي" readonly>

            <div id="seats-section">
                <span class="label-text">عدد المقاعد المطلوبة:</span>
                <div class="seats-container">
                    <div class="seat-option active" onclick="setSeats(1, this)">1 مقعد</div>
                    <div class="seat-option" onclick="setSeats(2, this)">2 مقعد</div>
                    <div class="seat-option" onclick="setSeats(3, this)">3 مقعد</div>
                    <div class="seat-option" onclick="setSeats(4, this)">4 مقعد</div>
                </div>
            </div>

            <div id="bidding-box" style="display:none;">
                <span class="label-text">السعر المقترح للمزايدة (جنيه)</span>
                <input type="number" id="driver-bid" placeholder="أدخل سعرك هنا">
            </div>

            <button class="btn-main" onclick="calculateInvoice()">حساب تكلفة الرحلة الحية</button>
            
            <div id="invoice" class="invoice-box"></div>
        </div>
    </div>

    <script>
        // إعلام تليجرام أن التطبيق جاهز للعمل وفك حظر الخريطة
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // فرد الشاشة كاملة في الموبايل
        }

        let map, originMarker, destinationMarker;
        let stage = 'origin';
        let isSurge = false;
        let selectedSeats = 1;
        let pickupCoords = null, dropoffCoords = null;

        // تشغيل الخريطة مع تفعيل إعدادات اللمس لشاشات الموبايل
        map = L.map('map', {
            zoomControl: false,
            dragging: true,
            touchZoom: true,
            tap: false
        }).setView([30.0444, 31.2357], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // إجبار المتصفح على رندر الخريطة فوراً وعدم إظهار لون أسود
        setTimeout(function(){
            map.invalidateSize(true);
        }, 300);

        map.on('click', function(e) {
            if (stage === 'origin') {
                if (originMarker) map.removeLayer(originMarker);
                originMarker = L.marker(e.latlng).addTo(map);
                pickupCoords = e.latlng;
                stage = 'destination';
                document.getElementById('instruction').innerText = "🏁 اضغط الآن لتحديد نقطة الوصول";
            } else {
                if (destinationMarker) map.removeLayer(destinationMarker);
                destinationMarker = L.marker(e.latlng).addTo(map);
                dropoffCoords = e.latlng;
                stage = 'origin';
                document.getElementById('instruction').innerText = "📍 تم تحديد النقطتين! يمكنك إعادة الضغط للتغيير";
            }
        });

        function toggleSurge() {
            isSurge = !isSurge;
            const btn = document.getElementById('surge-toggle');
            btn.innerText = isSurge ? "🔥 مفعل" : "🚫 مغلق";
            btn.style.backgroundColor = isSurge ? "#2ecc71" : "#e74c3c";
        }

        function setSeats(num, el) {
            selectedSeats = num;
            document.querySelectorAll('.seat-option').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            updateVehicleOptions();
        }

        function updateVehicleOptions() {
            const mode = document.getElementById('ride-mode').value;
            const vehicleInput = document.getElementById('vehicle-type');
            const bidding = document.getElementById('bidding-box');
            const seatsSec = document.getElementById('seats-section');

            if (mode === 'private') {
                vehicleInput.value = "ملاكي (خاصة بالكامل)";
                bidding.style.display = "block";
                seatsSec.style.display = "none";
            } else {
                bidding.style.display = "none";
                seatsSec.style.display = "block";
                if (selectedSeats <= 3) {
                    vehicleInput.value = "عربية سوزوكي";
                } else {
                    vehicleInput.value = "شاتل جماعي (ميكروباص)";
                }
            }
        }

        function calculateInvoice() {
            if (!pickupCoords || !dropoffCoords) {
                alert("الرجاء تحديد نقطة الركوب والوصول أولاً على الخريطة");
                return;
            }

            const distance = (pickupCoords.distanceTo(dropoffCoords) / 1000).toFixed(2);
            const baseFare = 10;
            const ratePerKm = isSurge ? 15 : 10;
            let singleTripCost = baseFare + (distance * ratePerKm);

            const invoiceDiv = document.getElementById('invoice');
            invoiceDiv.style.display = "block";

            let invoiceHtml = `<h3>📊 تفاصيل رحلة سكة المالية</h3>`;
            invoiceHtml += `<p>📏 <b>المسافة التقريبية:</b> ${distance} كم</p>`;

            const mode = document.getElementById('ride-mode').value;

            if (mode === 'combo') {
                let costPerPassenger = (singleTripCost / selectedSeats).toFixed(2);
                invoiceHtml += `<p style="color:#f39c12;">💰 <b>حساب المقعد الواحد الكومبو:</b> ${costPerPassenger} جنيه</p>`;
                invoiceHtml += `<p>👥 <b>حجز مقاعد:</b> ${selectedSeats} مقعد</p>`;
            } else {
                let customBid = parseFloat(document.getElementById('driver-bid').value) || singleTripCost;
                invoiceHtml += `<p style="color:#f39c12;">💎 <b>إجمالي قيمة الرحلة الخاصة:</b> ${customBid.toFixed(2)} جنيه</p>`;
            }

            invoiceDiv.innerHTML = invoiceHtml;
        }
    </script>
</body>
</html>
