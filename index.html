<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكة | Sekka</title>
    
    <!-- استدعاء ملفات تشغيل خريطة Leaflet الآمنة والمجانية تماماً 100% -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <script src="https://unpkg.com" crossorigin=""></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            text-align: center;
        }
        #map {
            width: 100%;
            height: 45vh; /* الخريطة ستشغل النصف العلوي من شاشة الهاتف */
            background-color: #222;
            border-bottom: 3px solid #f39c12;
        }
        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .instruction {
            font-size: 0.95rem;
            color: #f1c40f;
            margin-bottom: 12px;
            background: #2c2c2c;
            padding: 10px;
            border-radius: 6px;
            border-right: 4px solid #f39c12;
            font-weight: bold;
        }
        select, .seat-btn {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .seats-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .seat-option {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 10px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .seat-option.active {
            background: #27ae60;
            border-color: #2ecc71;
        }
        .btn-main {
            background-color: #f39c12;
            color: black;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-main:active {
            background-color: #e67e22;
        }
        .info-text {
            font-size: 0.85rem;
            color: #aaa;
            text-align: right;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- منطقة الخريطة الحية السحابية -->
    <div id="map"></div>

    <div class="container">
        <div class="card">
            <div id="instruction" class="instruction">📍 اضغط على الخريطة لتحديد [مكان الركوب]</div>
            
            <div class="info-text">نوع الرحلة</div>
            <select id="ride-type">
                <option value="instant">رحلة فورية (الآن) ⚡</option>
                <option value="scheduled">رحلة مجدولة لاحقاً 📅</option>
            </select>

            <div class="info-text">نوع الرحلة المطلوبة</div>
            <select id="car-type">
                <option value="private">رحلة خاصة (ملاكي بالكامل) 🔒</option>
                <option value="combo">رحلة جماعية (كومبو شاتل) 👥</option>
            </select>

            <div class="info-text">عدد المقاعد المطلوبة</div>
            <div class="seats-container">
                <div class="seat-option active" onclick="setSeats(1, this)">1 مقعد</div>
                <div class="seat-option" onclick="setSeats(2, this)">2 مقعد</div>
                <div class="seat-option" onclick="setSeats(3, this)">3 مقعد</div>
            </div>

            <button class="btn-main" onclick="submitRide()">🚕 تأكيد وطلب سكة</button>
        </div>
    </div>

<script>
    let map;
    let originMarker = null;
    let destinationMarker = null;
    let selectionStage = 'origin'; // تتحول إلى 'destination' بعد الضغط الأول
    let selectedSeats = 1;

    // 1. تشغيل الخريطة والتركيز التلقائي على إحداثيات القاهرة والمحافظات المحيطة بها مجاناً بالكامل
    const defaultCoords = [30.0444, 31.2357];
    map = L.map('map', { zoomControl: true }).setView(defaultCoords, 11);

    // 2. تحميل طبقات الخرائط المؤمنة بـ HTTPS من سيرفر OpenStreetMap الرسمي لتعمل على الهواتف مباشرة
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // محاولة التقاط موقع العميل بالـ GPS إذا سمح بذلك لتسهيل الاختيار
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            map.setView([position.coords.latitude, position.coords.longitude], 14);
        });
    }

    // 3. التحكم بالنقر على الخريطة لتسجيل نقطة البداية والنهاية
    map.on('click', function(e) {
        handleMapClick(e.latlng);
    });

    function handleMapClick(latlng) {
        if (selectionStage === 'origin') {
            if (originMarker) map.removeLayer(originMarker);
            
            originMarker = L.marker(latlng).addTo(map).bindPopup("<b>نقطة الركوب (A)</b>").openPopup();
            window.pickupCoords = latlng;
            
            selectionStage = 'destination';
            document.getElementById('instruction').innerText = "🏁 ممتاز! اضغط الآن لتحديد [وجهة الوصول]";
            document.getElementById('instruction').style.borderRightColor = "#2ecc71";
            document.getElementById('instruction').style.color = "#2ecc71";
        } else if (selectionStage === 'destination') {
            if (destinationMarker) map.removeLayer(destinationMarker);
            
            destinationMarker = L.marker(latlng).addTo(map).bindPopup("<b>وجهة الوصول (B)</b>").openPopup();
            window.dropoffCoords = latlng;
            
            selectionStage = 'origin'; // إرجاع المنظومة جاهزة لإعادة التحديد إذا أخطأ
            document.getElementById('instruction').innerText = "✅ تم تحديد المسار! يمكنك الضغط على تأكيد أو إعادة التحديد بنقرة جديدة.";
            document.getElementById('instruction').style.borderRightColor = "#f39c12";
            document.getElementById('instruction').style.color = "#f39c12";
        }
    }

    function setSeats(num, element) {
        selectedSeats = num;
        let options = document.querySelectorAll('.seat-option');
        options.forEach(opt => opt.classList.remove('active'));
        element.classList.add('active');
    }

    function submitRide() {
        if (!window.pickupCoords || !window.dropoffCoords) {
            alert("برجاء تحديد موقع الركوب والوجهة على الخريطة أولاً.");
            return;
        }
        
        // حساب مسافة مستقيمة تقريبية بالكيلومتر بين النقطتين لتحديد السعر الفوري
        const distance = (map.distance(window.pickupCoords, window.dropoffCoords) / 1000).toFixed(2);
        const pricePerKm = 10;
        let totalPrice = distance * pricePerKm;

        // منطق الميكروباصات والرحلات المشتركة: إذا كانت المقاعد أكثر من 3 أشخاص قسّم التكلفة
        if (selectedSeats > 3) {
            totalPrice = totalPrice / selectedSeats;
        }

        alert(`تم احتساب تفاصيل رحلة "سكة":\n\n المسافة الفعليّة: ${distance} كم\n💰 إجمالي التكلفة التقديرية (10 ج/كم): ${totalPrice.toFixed(2)} جنيه مصري.\n\nسيتم إرسال الطلب فوراً لشبكة الكباتن المتاحة.`);
        
        // هنا يتم مستقبلاً إضافة كود الـ Fetch لربط السيرفر وإرسال الرسالة لتليجرام الكابتن مباشرة
    }
</script>
</body>
</html>
