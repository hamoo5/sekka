<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة سكة | Sekka System</title>
    
    <!-- استدعاء مكتبات الخرائط الاحترافية المؤمنة لتعمل على الموبايل بدون مساحات فارغة -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            overflow: hidden;
        }
        /* تصميم الحاوية لضمان عمل الخريطة والشوارع بكامل أبعادها الملونة */
        #map {
            width: 100%;
            height: 320px !important;
            background-color: #e5e3df !important; /* لون تمهيدي شبيه بأوبر قبل اكتمال التحميل */
            border-bottom: 3px solid #f39c12;
            position: relative;
            z-index: 10;
            display: block !important;
        }
        .container {
            padding: 10px;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
            height: calc(100% - 320px);
            overflow-y: auto;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .instruction {
            font-size: 0.9rem;
            color: #f1c40f;
            margin-bottom: 10px;
            background: #2c2c2c;
            padding: 8px;
            border-radius: 6px;
            border-right: 4px solid #f39c12;
            font-weight: bold;
            text-align: center;
        }
        .surge-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c2c2c;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }
        .toggle-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .seats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
            margin-bottom: 12px;
        }
        .seat-option {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 8px 4px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
        }
        .seat-option.active {
            background: #f39c12;
            color: black;
            border-color: #f39c12;
        }
        .btn-main {
            background-color: #f39c12;
            color: black;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .invoice-box {
            background: #1a1a1a;
            border: 1px dashed #f39c12;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: right;
            font-size: 0.85rem;
            line-height: 1.5;
            display: none;
        }
        .label-text {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- الخريطة بتهيئة برمجية علوية إجبارية -->
    <div id="map"></div>

    <div class="container">
        <div class="surge-section">
            <span>⚡ وضع وقت الذروة (التسعير المرتفع 15 ج/كم):</span>
            <button id="surge-toggle" class="toggle-btn" onclick="toggleSurge()">مغلق ❌</button>
        </div>

        <div class="card">
            <div id="instruction" class="instruction">📍 اضغط على الخريطة لتحديد [مكان الركوب]</div>
            
            <span class="label-text">نوع الرحلة المطلوبة:</span>
            <select id="ride-mode" onchange="updateVehicleOptions()">
                <option value="combo">رحلة مشتركة (كومبو شاتل - تقسيم السعر) 👥</option>
                <option value="private">رحلة خاصة (ملاكي بالكامل ومزايدة) 🔒</option>
            </select>

            <span class="label-text">السيارة المقترحة تلقائياً للاسطول:</span>
            <input type="text" id="vehicle-type" value="عربية سوزوكي" readonly />

            <div id="seats-section">
                <span class="label-text">عدد المقاعد المطلوبة:</span>
                <div class="seats-container">
                    <div class="seat-option active" onclick="setSeats(1, this)">1 مقعد</div>
                    <div class="seat-option" onclick="setSeats(2, this)">2 مقعد</div>
                    <div class="seat-option" onclick="setSeats(3, this)">3 مقعد</div>
                    <div class="seat-option" onclick="setSeats(4, this)">4 مقعد</div>
                </div>
            </div>

            <div id="bidding-box" style="display:none;">
                <span class="label-text">اقترح سعراً للرحلة الملاكي (جنيه):</span>
                <input type="number" id="driver-bid" value="50" />
            </div>

            <button class="btn-main" onclick="calculateInvoice()">🚕 تأكيد وحساب سكة</button>
            <div id="invoice" class="invoice-box"></div>
        </div>
    </div>

<script>
    let map, originMarker, destinationMarker, routeLine;
    let stage = 'origin';
    let isSurge = false;
    let selectedSeats = 1;
    let pickupCoords = null, dropoffCoords = null;

    // تشغيل الخريطة عبر سيرفرات تتبع حية لضمان عمل الشوارع الملونة بنسبة 100%
    function initMap() {
        map = L.map('map', {
            zoomControl: true,
            tap: false
        }).setView([30.0444, 31.2357], 12);

        // استخدام سيرفرات خرائط ملونة مخصصة ومحمية بالكامل عبر ستايل تتبع الشوارع الحقيقي
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // إجبار الهاتف على تحديث طبقات الخريطة فور فتح الصفحة لعدم حدوث تعليق
        setTimeout(() => { map.invalidateSize(); }, 400);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                map.setView([p.coords.latitude, p.coords.longitude], 14);
            });
        }
    }

    window.onload = initMap;

    map.on('click', function(e) {
        if (stage === 'origin') {
            if (originMarker) map.removeLayer(originMarker);
            if (routeLine) map.removeLayer(routeLine);
            originMarker = L.marker(e.latlng).addTo(map);
            pickupCoords = e.latlng;
            stage = 'destination';
            document.getElementById('instruction').innerText = "🏁 اضغط الآن لتحديد [وجهة الوصول]";
        } else {
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.marker(e.latlng).addTo(map);
            dropoffCoords = e.latlng;
            stage = 'origin';
            document.getElementById('instruction').innerText = "✅ تم تحديد المسار بنجاح!";
            
            // رسم خط الرحلة المباشر الملون بين النقطتين مثل أوبر
            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline([pickupCoords, dropoffCoords], {color: '#f39c12', weight: 4}).addTo(map);
            map.fitBounds(L.polyline([pickupCoords, dropoffCoords]).getBounds(), {padding: [30, 30]});
        }
    });

    function toggleSurge() {
        isSurge = !isSurge;
        const btn = document.getElementById('surge-toggle');
        btn.innerText = isSurge ? "مفعل 🔥" : "مغلق ❌";
        btn.style.backgroundColor = isSurge ? "#2ecc71" : "#e74c3c";
    }

    function setSeats(num, el) {
        selectedSeats = num;
        document.querySelectorAll('.seat-option').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active');
        updateVehicleOptions();
    }

    function updateVehicleOptions() {
        const mode = document.getElementById('ride-mode').value;
        const vehicleInput = document.getElementById('vehicle-type');
        const bidding = document.getElementById('bidding-box');
        const seatsSec = document.getElementById('seats-section');

        if (mode === 'private') {
            vehicleInput.value = "عربية ملاكي (خاصة بالكامل)";
            bidding.style.display = "block";
            seatsSec.style.display = "none";
        } else {
            bidding.style.display = "none";
            seatsSec.style.display = "block";
            if (selectedSeats <= 3) {
                vehicleInput.value = "عربية سوزوكي";
            } else {
                vehicleInput.value = "ميكروباص (شاتل جماعي)";
            }
        }
    }

    function calculateInvoice() {
        if (!pickupCoords || !dropoffCoords) {
            alert("برجاء لمس شاشة الخريطة في الأعلى وتحديد النقطتين أولاً.");
            return;
        }
