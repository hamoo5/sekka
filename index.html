<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة سكة | Sekka System</title>
    
    <!-- استدعاء المكتبات بترتيب برمي آمن ومضمون للظهور على الهواتف -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <script src="https://unpkg.com" crossorigin=""></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            overflow-x: hidden;
        }
        /* تحديد أبعاد صريحة بالبكسل لضمان ظهور الخريطة على شاشات الموبايل المتنوعة */
        #map {
            width: 100%;
            height: 280px;
            background-color: #222;
            border-bottom: 3px solid #f39c12;
            position: relative;
            z-index: 1;
        }
        .container {
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .instruction {
            font-size: 0.95rem;
            color: #f1c40f;
            margin-bottom: 12px;
            background: #2c2c2c;
            padding: 10px;
            border-radius: 6px;
            border-right: 4px solid #f39c12;
            font-weight: bold;
            text-align: center;
        }
        .surge-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
        .toggle-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: #2ecc71;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .seats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .seat-option {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 10px 5px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            font-weight: bold;
        }
        .seat-option.active {
            background: #f39c12;
            color: black;
            border-color: #f39c12;
        }
        .btn-main {
            background-color: #f39c12;
            color: black;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-main:active {
            background-color: #e67e22;
        }
        .invoice-box {
            background: #1a1a1a;
            border: 1px dashed #f39c12;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            text-align: right;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }
        .label-text {
            font-size: 0.85rem;
            color: #aaa;
            display: block;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- الجزء الخاص بالخريطة بارتفاع ثابت ومضمون -->
    <div id="map"></div>

    <div class="container">
        <!-- تفعيل وضع وقت الذروة تبعا للكتالوج -->
        <div class="surge-section">
            <span>⚡ وضع وقت الذروة (التسعير المرتفع 15 ج/كم):</span>
            <button id="surge-toggle" class="toggle-btn" onclick="toggleSurge()">مغلق ❌</button>
        </div>

        <div class="card">
            <div id="instruction" class="instruction">📍 اضغط على الخريطة لتحديد [مكان الركوب]</div>
            
            <span class="label-text">نوع الرحلة المطلوبة:</span>
            <select id="ride-mode" onchange="updateVehicleOptions()">
                <option value="combo">رحلة مشتركة (كومبو شاتل - تقسيم السعر) 👥</option>
                <option value="private">رحلة خاصة (ملاكي بالكامل ومزايدة) 🔒</option>
            </select>

            <span class="label-text">السيارة المقترحة تلقائياً للاسطول:</span>
            <input type="text" id="vehicle-type" value="عربية سوزوكي" readonly />

            <div id="seats-section">
                <span class="label-text">عدد المقاعد المطلوبة:</span>
                <div class="seats-container">
                    <div class="seat-option active" onclick="setSeats(1, this)">1 مقعد</div>
                    <div class="seat-option" onclick="setSeats(2, this)">2 مقعد</div>
                    <div class="seat-option" onclick="setSeats(3, this)">3 مقعد</div>
                    <div class="seat-option" onclick="setSeats(4, this)">4 مقعد</div>
                </div>
            </div>

            <!-- حقل المزايدة الحية للرحلات الخاصة إن درايف -->
            <div id="bidding-box" style="display:none;">
                <span class="label-text">اقترح سعراً مريحاً لك للرحلة الملاكي (جنيه):</span>
                <input type="number" id="driver-bid" value="50" />
            </div>

            <button class="btn-main" onclick="calculateInvoice()">🚕 تأكيد وحساب سكة</button>

            <!-- صندوق تفاصيل الفاتورة والارباح وصافي دخل الكابتن -->
            <div id="invoice" class="invoice-box"></div>
        </div>
    </div>

<script>
    let map, originMarker, destinationMarker;
    let stage = 'origin';
    let isSurge = false;
    let selectedSeats = 1;
    let pickupCoords = null, dropoffCoords = null;

    // تهيئة الخريطة لتعمل فوراً وتلقائياً بداخل سيرفر مفتوح
    map = L.map('map', {
        zoomControl: true,
        tap: false // لحل مشاكل اللمس ببعض الهواتف
    }).setView([30.0444, 31.2357], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // تتبع الموقع الحالي عبر الـ GPS للمستخدم
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
            let userLoc = [p.coords.latitude, p.coords.longitude];
            map.setView(userLoc, 14);
        }, () => {
            console.log("تم رفض الصلاحية أو الـ GPS مغلق.");
        });
    }

    // رصد النقرات على الخريطة
    map.on('click', function(e) {
        if (stage === 'origin') {
            if (originMarker) map.removeLayer(originMarker);
            originMarker = L.marker(e.latlng).addTo(map);
            pickupCoords = e.latlng;
            stage = 'destination';
            document.getElementById('instruction').innerText = "🏁 اضغط الآن لتحديد [وجهة الوصول]";
        } else {
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.marker(e.latlng).addTo(map);
            dropoffCoords = e.latlng;
            stage = 'origin';
            document.getElementById('instruction').innerText = "✅ تم! اضغط بالأسفل لتأكيد وحساب سكة";
        }
    });

    function toggleSurge() {
        isSurge = !isSurge;
        const btn = document.getElementById('surge-toggle');
        if(isSurge) {
            btn.innerText = "مفعل 🔥"; btn.style.backgroundColor = "#2ecc71";
        } else {
            btn.innerText = "مغلق ❌"; btn.style.backgroundColor = "#e74c3c";
        }
    }

    function setSeats(num, el) {
        selectedSeats = num;
        document.querySelectorAll('.seat-option').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active');
        updateVehicleOptions();
    }

    // تعديل وتغيير نوع السيارة ديناميكياً لتفادي مشكلة ثبات السوزوكي
    function updateVehicleOptions() {
        const mode = document.getElementById('ride-mode').value;
        const vehicleInput = document.getElementById('vehicle-type');
        const bidding = document.getElementById('bidding-box');
        const seatsSec = document.getElementById('seats-section');

        if (mode === 'private') {
            vehicleInput.value = "عربية ملاكي (خاصة بالكامل)";
            bidding.style.display = "block";
            seatsSec.style.display = "none"; // إخفاء المقاعد لأنها رحلة خاصة
        } else {
            bidding.style.display = "none";
            seatsSec.style.display = "block";
            // تقسيم الأسطول حسب كتالوج سكة
            if (selectedSeats <= 3) {
                vehicleInput.value = "عربية سوزوكي";
            } else {
                vehicleInput.value = "ميكروباص (شاتل جماعي)";
            }
        }
    }

    function calculateInvoice() {
        if (!pickupCoords || !dropoffCoords) {
            alert("برجاء لمس شاشة الخريطة في الأعلى وتحديد النقطتين أولاً.");
            return;
        }

        // حساب مسافة الرحلة الحقيقية بالكيلو
        const distance = (map.distance(pickupCoords, dropoffCoords) / 1000).toFixed(2);
        const baseFare = 10; // فتحة العداد الثابتة بالكتالوج
        const ratePerKm = isSurge ? 15 : 10; // التسعير بناءً على الذروة
