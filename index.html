<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سكة | Sekka</title>
    <!-- استدعاء خريطة Leaflet المجانية تماماً -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #f8f9fa; color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* إجبار الخريطة على أخذ الجزء العلوي من الشاشة بالكامل */
        #map {
            width: 100%;
            flex: 1; /* تأخذ كل المساحة المتاحة في الأعلى */
            z-index: 1;
            background-color: #e5e3df;
        }

        /* لوحة التحكم السفلية تحت الخريطة مباشرة */
        .controls-panel {
            background: white; 
            padding: 15px 20px 25px 20px;
            border-top-left-radius: 25px; 
            border-top-right-radius: 25px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1); 
            z-index: 999;
            box-sizing: border-box;
        }
        .status-box {
            background: #fffde7; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 0.95rem; font-weight: bold;
            color: #f57f17; border: 1px solid #fff59d; margin-bottom: 12px;
        }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; }
        select {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 0.95rem; background-color: white; color: #333;
            box-sizing: border-box;
        }
        .seats-container { display: flex; gap: 10px; }
        .seat-btn {
            flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            background: #f1f3f5; color: #333; cursor: pointer; text-align: center; font-weight: bold;
        }
        .seat-btn.active { background-color: #28a745; color: white; border-color: #28a745; }
        
        .action-btn {
            background-color: #f39c12; color: white; border: none; padding: 15px;
            width: 100%; border-radius: 10px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        .action-btn:active { background-color: #d6860b; }
    </style>
</head>
<body>

    <!-- الخريطة تظهر هنا أولاً في الجزء العلوي -->
    <div id="map"></div>

    <!-- لوحة التحكم السفلي تحت الخريطة تماماً -->
    <div class="controls-panel">
        <div id="status-text" class="status-box">📍 اضغط على الخريطة لتحديد [مكان الركوب]</div>
        
        <div class="form-group">
            <label>نوع الرحلة</label>
            <select><option>رحلة فورية (الآن) ⚡</option></select>
        </div>

        <div class="form-group">
            <label>نوع الرحلة المطلوبة</label>
            <select><option>رحلة خاصة (ملاكي بالكامل) 🔒</option></select>
        </div>

        <div class="form-group">
            <label>عدد المقاعد المطلوبة</label>
            <div class="seats-container">
                <div class="seat-btn active" onclick="selectSeat(this, 1)">1 مقعد</div>
                <div class="seat-btn" onclick="selectSeat(this, 2)">2 مقعد</div>
                <div class="seat-btn" onclick="selectSeat(this, 3)">3 مقعد</div>
            </div>
        </div>
        
        <button class="action-btn" onclick="triggerAction()">تأكيد وطلب سكة 🚕</button>
    </div>

    <!-- ملفات تشغيل الخرائط -->
    <script src="https://unpkg.com"></script>
    <script>
        let map, userMarker, targetMarker;
        let stage = 'pickup'; 
        let selectedSeats = 1;

        // إطلاق الخريطة مباشرة عند فتح الصفحة
        map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // التقاط موقع الـ GPS الفعلي للهاتف
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const myLoc = [position.coords.latitude, position.coords.longitude];
                map.setView(myLoc, 15);
                userMarker = L.marker(myLoc).addTo(map).bindPopup("مكانك الحالي 📍").openPopup();
            });
        }

        // تحديد النقاط بالضغط على الخريطة
        map.on('click', function(e) {
            if (stage === 'pickup') {
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker(e.latlng).addTo(map).bindPopup("<b>نقطة الركوب 📍</b>").openPopup();
                stage = 'destination';
                document.getElementById('status-text').innerText = "🏁 ممتاز! اضغط الآن لتحديد [وجهة الوصول]";
            } else {
                if (targetMarker) map.removeLayer(targetMarker);
                targetMarker = L.marker(e.latlng).addTo(map).bindPopup("<b>وجهة الوصول 🏁</b>").openPopup();
                stage = 'pickup';
                document.getElementById('status-text').innerText = "✔️ تم تحديد المسار بالكامل! اضغط تأكيد الطلب.";
            }
        });

        function selectSeat(element, count) {
            document.querySelectorAll('.seat-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedSeats = count;
        }

        function triggerAction() {
            if (!userMarker || !targetMarker) {
                alert("برجاء تحديد موقع الركوب والوجهة على الخريطة أولاً.");
                return;
            }
            alert(`🚀 تم إرسال طلبك بنجاح! \nالمقاعد: ${selectedSeats} \nجاري البحث عن كابتن على نفس السكة...`);
        }
    </script>
</body>
</html>
