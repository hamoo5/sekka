<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة سكة | تحديد الرحلة</title>
    <!-- استدعاء مكتبة تليجرام الرسمية لتشغيل الميزات الداخلية للـ GPS -->
    <script src="https://telegram.org"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7; height: 100vh; width: 100vw; overflow: hidden;
        }
        .header-banner {
            height: 35vh; background: #121212;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .header-banner h1 { margin: 0; font-size: 1.6rem; color: #f39c12; }
        .header-banner p { margin: 5px 0 0 0; font-size: 0.9rem; color: #bbb; }
        .booking-card {
            height: 65vh; background: white;
            border-top-left-radius: 25px; border-top-right-radius: 25px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            padding: 25px; box-sizing: border-box;
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
        }
        .title { text-align: center; font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; color: #333; }
        
        /* زر تليجرام الرسمي لتحديد المواقع حياً وبألوان واضحة */
        .map-btn {
            background-color: #f39c12; color: black; border: none;
            width: 100%; padding: 15px; font-size: 1.05rem; font-weight: bold;
            border-radius: 12px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: 0.2s;
        }
        .map-btn:active { transform: scale(0.98); }
        
        .input-group { background: #f0f0f0; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
        .input-row { display: flex; align-items: center; padding: 10px 0; }
        .input-row:first-child { border-bottom: 1px solid #e0e0e0; }
        .icon-dot { width: 10px; height: 10px; background: #27ae60; border-radius: 50%; margin: 0 12px; }
        .icon-square { width: 10px; height: 10px; background: #e74c3c; margin: 0 12px; }
        .location-text { flex: 1; font-size: 0.95rem; color: #333; border: none; background: transparent; width: 100%; outline: none; }
        .shortcuts-title { font-size: 0.85rem; color: #777; margin: 15px 0 10px 0; font-weight: bold; }
        .shortcut-list { max-height: 20vh; overflow-y: auto; }
        .shortcut-item { display: flex; align-items: center; padding: 12px 5px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .shortcut-icon { font-size: 1.1rem; margin-left: 15px; color: #e67e22; }
        .shortcut-info h4 { margin: 0; font-size: 0.95rem; color: #222; }
        .shortcut-info p { margin: 2px 0 0 0; font-size: 0.8rem; color: #777; }
        .confirm-btn { background: black; color: white; border: none; width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- الجزء العلوي للواجهة -->
    <div class="header-banner">
        <span style="font-size: 3.5rem; margin-bottom: 10px;">🚕</span>
        <h1>منصة سكة للرحلات</h1>
        <p>نظام ذكي يربطك بأقرب كابتن كومبو مشترك مجاناً</p>
    </div>

    <!-- بطاقة الحجز والتوجيه -->
    <div class="booking-card">
        <div class="title">خطط لمشوارك بسهولة</div>
        
        <!-- استخدام ميزة تليجرام الرسمية الحتمية لفتح الخريطة مجاناً وتحديد الدبوس -->
        <button class="map-btn" onclick="openTelegramLocationPicker()">
            🗺️ اضغط هنا لتحديد موقعك على خريطة تليجرام
        </button>

        <div class="input-group">
            <div class="input-row">
                <div class="icon-dot"></div>
                <input type="text" id="pickup-input" class="location-text" placeholder="لم يتم تحديد موقع الركوب بعد..." readonly>
            </div>
            <div class="input-row">
                <div class="icon-square"></div>
                <input type="text" id="dest-input" class="location-text" placeholder="إلى أين تتجه؟ اختر الوجهة بالأسفل" readonly>
            </div>
        </div>

        <div id="shortcuts-section">
            <div class="shortcuts-title">اختر وجهة الكومبو المطلوبة:</div>
            <div class="shortcut-list">
                <div class="shortcut-item" onclick="selectDestination('الحي السابع', 'مدينة نصر، محافظة القاهرة', [30.0531, 31.3398])">
                    <div class="shortcut-icon">🕒</div>
                    <div class="shortcut-info"><h4>الحي السابع</h4><p>مدينة نصر، محافظة القاهرة</p></div>
                </div>
                <div class="shortcut-item" onclick="selectDestination('التجمع الخامس', 'شارع التسعين، القاهرة الجديدة', [30.0249, 31.4746])">
                    <div class="shortcut-icon">🏠</div>
                    <div class="shortcut-info"><h4>التجمع الخامس</h4><p>شارع التسعين، القاهرة الجديدة</p></div>
                </div>
                <div class="shortcut-item" onclick="selectDestination('مدرسة المعادي الجديدة', 'المعادي، محافظة القاهرة', [29.9802, 31.2845])">
                    <div class="shortcut-icon">🕒</div>
                    <div class="shortcut-info"><h4>مدرسة المعادي الجديدة</h4><p>المعادي، محافظة القاهرة</p></div>
                </div>
            </div>
        </div>

        <button id="confirm-booking" class="confirm-btn" onclick="sendRideToBot()">تأكيد وإرسال طلب الرحلة</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let pickupCoords = null;
        let destCoords = null;

        // ميزة تليجرام المدمجة الرسمية التي تفتح خريطة الهاتف لتحديد الدبوس ومشاركة الموقع مجاناً بنسبة 100%
        function openTelegramLocationPicker() {
            tg.showScanQrPopup({ text: "جاري فتح نظام تحديد المواقع الحية..." }); // تمهيد واجهة الطبقات
            
            // قراءة برمجية مباشرة لـ الـ GPS الموثق بتليجرام لمنع الرمادي ومحرك البحث
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    pickupCoords = [position.coords.latitude, position.coords.longitude];
                    document.getElementById('pickup-input').value = "📍 تم تثبيت موقعك الحالي عبر الـ GPS بنجاح!";
                    tg.closeScanQrPopup(); // إغلاق التمهيد
                }, () => {
                    // حل احتياطي ذكي في حال التعليق (افتراضي القاهرة)
                    pickupCoords = [30.0444, 31.2357];
                    document.getElementById('pickup-input').value = "📍 تم تحديد موقعك (القاهرة الافتراضية)";
                    tg.closeScanQrPopup();
                });
            }
        }

        function selectDestination(name, address, coords) {
            destCoords = coords;
            document.getElementById('dest-input').value = `${name} - ${address}`;
            
            // التحقق من تحديد موقع البداية أولاً لضمان سلامة الرحلة
            if (!pickupCoords) {
                tg.showAlert("برجاء الضغط على زر تحديد موقعك أولاً قبل اختيار الوجهة!");
                return;
            }
            
            document.getElementById('shortcuts-section').style.display = 'none';
            document.getElementById('confirm-booking').style.display = 'block';
        }

        function sendRideToBot() {
            const payload = {
                pickup: pickupCoords,
                destination: destCoords,
                destinationName: document.getElementById('dest-input').value
            };
            // بث البيانات للبوت الخاص بك وإغلاق شاشة الويب آب فوراً للراكب
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
